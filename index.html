<html>

    <style>
      html,
      body,
      #viewDiv {
        padding: 0;

    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css" />
    <script type="module" src="https://js.arcgis.com/5.0"></script>
    <script type="module">
      const [
        esriConfig,
        Map,
        MapView,
        Directions,
        SimpleMarkerSymbol,
        RouteLayer,
        Expand,
      ] = await $arcgis.import([
        "@arcgis/core/config.js",
        "@arcgis/core/Map.js",
        "@arcgis/core/views/MapView.js",
        "@arcgis/core/widgets/Directions.js",
        "@arcgis/core/symbols/SimpleMarkerSymbol.js",
        "@arcgis/core/layers/RouteLayer.js",
        "@arcgis/core/widgets/Expand.js",
      ]);

      esriConfig.apiKey = "AAPTa6Kuis50oPDNd6kOBER5V2Q..j2Qb0WfdGRkXUhFiOPrk-JtVChIiiq9ve8UErd0w1Y_xQECFFMo9pCG2DyRmz_hsPWnC6l_xBFKfOsybv6rUBuTwBNpkVvCWcnwgTgL9RlYpmL2wnNANmDEssEl1mSga8CuXrsJk-vA4kog_fDiTHxE4KND6b6ffBFWkKieL8tkTEXst7zaaPhi80DY8qRKwmNFP6Bv4O7mOdZ-h6M1kwljlhWWzc2_Pd2cLJiDQMxMrbtnLlwzweymB0zZyS8NGchmboA..AT1_6L9UUTc5";

      const routeLayer = new RouteLayer({
        url: "https://route-api.arcgis.com/arcgis/rest/services/World/Route/NAServer/Route_World/",
      });

      const map = new Map({
        basemap: "arcgis/navigation",
        layers: [routeLayer],
      });

      const view = new MapView({
        container: "viewDiv",
        map: map,
        center: [-118.24532, 34.05398],
        zoom: 12,
        constraints: {
          snapToZoom: false,
        },
      });

      const directions = new Directions({
        view: view,
        layer: routeLayer,
      });

      view.ui.add(
        new Expand({
          view: view,
          content: directions,
          expanded: true,
        }),
        "top-right"
      );
